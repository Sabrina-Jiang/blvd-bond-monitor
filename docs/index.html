<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blvd & Bond Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Blvd &amp; Bond Monitor</h1>
    <nav>
      <a href="index.html">Current Units</a>
      <a href="history.html">Change History</a>
    </nav>
  </header>
  <main>
    <p class="meta" id="meta">Loading…</p>

    <div class="card filters">
      <div class="filter-row">
        <div class="filter-group">
          <span class="filter-group-label">Bedrooms</span>
          <div id="f-bedrooms" class="checkbox-group"></div>
        </div>
        <label>Building
          <select id="f-building"><option value="">All</option></select>
        </label>
        <label>Min price
          <input type="number" id="f-min-price" placeholder="$">
        </label>
        <label>Max price
          <input type="number" id="f-max-price" placeholder="$">
        </label>
        <label>Min sqft
          <input type="number" id="f-min-sqft" placeholder="sqft">
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="f-favorites-only"> Favorites only
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="f-reduced-only"> Recently reduced only
        </label>
        <button type="button" id="f-reset" class="btn btn-secondary">Reset</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th></th>
          <th>Unit</th>
          <th>Building</th>
          <th>Type</th>
          <th>Sqft</th>
          <th>Price</th>
          <th>Recent change</th>
          <th>Trend</th>
          <th>Available</th>
          <th>Days listed</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="units-body"></tbody>
    </table>
  </main>
  <script src="chart.js"></script>
  <script>
    const FAV_KEY = 'bbm_favorites';
    const FILTER_KEY = 'bbm_filters';
    const DEFAULT_BEDROOMS = ['1BR', '2BR'];

    const fmtPrice = (p) => (p != null ? '$' + Number(p).toLocaleString() : '—');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const daysListed = (firstSeenAt) => firstSeenAt ? Math.max(0, Math.floor((Date.now() - new Date(firstSeenAt).getTime()) / 86400000)) : null;
    const daysAgo = (iso) => Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);

    function loadFavorites() {
      try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY)) || []); } catch { return new Set(); }
    }
    function saveFavorites(set) {
      localStorage.setItem(FAV_KEY, JSON.stringify([...set]));
    }
    let favorites = loadFavorites();

    function loadFilterState() {
      try { return JSON.parse(localStorage.getItem(FILTER_KEY)) || null; } catch { return null; }
    }
    function saveFilterState(state) {
      localStorage.setItem(FILTER_KEY, JSON.stringify(state));
    }

    let allUnits = [];
    let recentChangeByUnit = new Map();

    const BEDROOM_ORDER = ['Studio', '1BR', '2BR', '3BR', '4BR'];

    function populateFilterOptions(units) {
      const present = new Set(units.map((u) => u.bedrooms).filter(Boolean));
      const ordered = BEDROOM_ORDER.filter((b) => present.has(b))
        .concat([...present].filter((b) => !BEDROOM_ORDER.includes(b)).sort());

      const saved = loadFilterState();
      const checkedSet = new Set(
        saved && Array.isArray(saved.bedrooms)
          ? saved.bedrooms
          : DEFAULT_BEDROOMS.filter((b) => present.has(b)).length
            ? DEFAULT_BEDROOMS
            : ordered
      );

      const group = document.getElementById('f-bedrooms');
      group.innerHTML = ordered.map((b) => `
        <label class="checkbox-label">
          <input type="checkbox" class="f-bedroom-cb" value="${esc(b)}" ${checkedSet.has(b) ? 'checked' : ''}> ${esc(b)}
        </label>`).join('');

      const buildings = [...new Set(units.map((u) => u.address).filter(Boolean))].sort();
      const buildingSel = document.getElementById('f-building');
      buildings.forEach((b) => buildingSel.insertAdjacentHTML('beforeend', `<option value="${esc(b)}">${esc(b)}</option>`));

      if (saved) {
        buildingSel.value = saved.building || '';
        document.getElementById('f-min-price').value = saved.minPrice ?? '';
        document.getElementById('f-max-price').value = saved.maxPrice ?? '';
        document.getElementById('f-min-sqft').value = saved.minSqft ?? '';
        document.getElementById('f-favorites-only').checked = !!saved.favoritesOnly;
        document.getElementById('f-reduced-only').checked = !!saved.reducedOnly;
      }

      group.querySelectorAll('.f-bedroom-cb').forEach((cb) => {
        cb.addEventListener('change', applyFilters);
      });
    }

    function currentFilterState() {
      const bedrooms = [...document.querySelectorAll('.f-bedroom-cb:checked')].map((cb) => cb.value);
      return {
        bedrooms,
        building: document.getElementById('f-building').value,
        minPrice: document.getElementById('f-min-price').value,
        maxPrice: document.getElementById('f-max-price').value,
        minSqft: document.getElementById('f-min-sqft').value,
        favoritesOnly: document.getElementById('f-favorites-only').checked,
        reducedOnly: document.getElementById('f-reduced-only').checked,
      };
    }

    function applyFilters() {
      const state = currentFilterState();
      saveFilterState(state);

      const bedroomSet = new Set(state.bedrooms);
      const minPrice = parseFloat(state.minPrice);
      const maxPrice = parseFloat(state.maxPrice);
      const minSqft = parseFloat(state.minSqft);

      const filtered = allUnits.filter((u) => {
        if (bedroomSet.size && !bedroomSet.has(u.bedrooms)) return false;
        if (state.building && u.address !== state.building) return false;
        if (!isNaN(minPrice) && (u.price == null || u.price < minPrice)) return false;
        if (!isNaN(maxPrice) && (u.price == null || u.price > maxPrice)) return false;
        if (!isNaN(minSqft) && (u.sqft == null || u.sqft < minSqft)) return false;
        if (state.favoritesOnly && !favorites.has(u.unitId)) return false;
        if (state.reducedOnly) {
          const change = recentChangeByUnit.get(u.unitId);
          if (!change || change.type !== 'price_decrease') return false;
        }
        return true;
      });
      renderTable(filtered);
    }

    function toggleFavorite(unitId) {
      if (favorites.has(unitId)) favorites.delete(unitId); else favorites.add(unitId);
      saveFavorites(favorites);
      applyFilters();
    }
    window.toggleFavorite = toggleFavorite;

    function renderChangeCell(unitId) {
      const change = recentChangeByUnit.get(unitId);
      if (!change) return '—';
      const isDown = change.type === 'price_decrease';
      const delta = Math.abs(change.newValue - change.oldValue);
      const arrow = isDown ? '▼' : '▲';
      const cls = isDown ? 'tag-down' : 'tag-up';
      const ago = daysAgo(change.detectedAt);
      const when = ago <= 0 ? 'today' : ago === 1 ? '1d ago' : `${ago}d ago`;
      return `<span class="tag ${cls}">${arrow} $${delta.toLocaleString()}</span> <span class="meta-inline">${when}</span>`;
    }

    function renderTable(units) {
      const body = document.getElementById('units-body');
      const oneDayAgo = Date.now() - 24 * 60 * 60 * 1000;

      if (!units.length) {
        body.innerHTML = '<tr><td colspan="11" class="empty">No units match these filters.</td></tr>';
        return;
      }

      body.innerHTML = units.map((u) => {
        const isNew = u.firstSeenAt && new Date(u.firstSeenAt).getTime() > oneDayAgo;
        const isFav = favorites.has(u.unitId);
        const dl = daysListed(u.firstSeenAt);
        const history = u.priceHistory || [];
        const isLowest = history.length >= 2 && u.price != null && u.price <= Math.min(...history.map((h) => h.price));
        const points = history.map((h) => ({ x: new Date(h.at), y: h.price }));
        return `<tr class="${isNew ? 'is-new' : ''}">
          <td><button type="button" class="star-btn ${isFav ? 'is-fav' : ''}" onclick="toggleFavorite('${u.unitId}')" aria-label="toggle favorite">${isFav ? '★' : '☆'}</button></td>
          <td><a class="unit-link" href="unit.html?id=${encodeURIComponent(u.unitId)}">${esc(u.unitId)}</a>${isNew ? '<span class="tag tag-new">NEW</span>' : ''}${isLowest ? '<span class="tag tag-low">LOWEST</span>' : ''}</td>
          <td>${esc(u.address)}</td>
          <td>${esc(u.typeLine)}</td>
          <td>${esc(u.sqft)}</td>
          <td class="price">${fmtPrice(u.price)}</td>
          <td>${renderChangeCell(u.unitId)}</td>
          <td>${sparklineSVG(points, { width: 180, height: 36 })}</td>
          <td>${esc(u.available)}</td>
          <td>${dl != null ? dl : '—'}</td>
          <td><a href="${esc(u.detailUrl)}" target="_blank" rel="noopener">view</a></td>
        </tr>`;
      }).join('');
    }

    ['f-building', 'f-min-price', 'f-max-price', 'f-min-sqft', 'f-favorites-only', 'f-reduced-only'].forEach((id) => {
      document.getElementById(id).addEventListener('input', applyFilters);
      document.getElementById(id).addEventListener('change', applyFilters);
    });
    document.getElementById('f-reset').addEventListener('click', () => {
      document.querySelectorAll('.f-bedroom-cb').forEach((cb) => { cb.checked = DEFAULT_BEDROOMS.includes(cb.value); });
      document.getElementById('f-building').value = '';
      document.getElementById('f-min-price').value = '';
      document.getElementById('f-max-price').value = '';
      document.getElementById('f-min-sqft').value = '';
      document.getElementById('f-favorites-only').checked = false;
      document.getElementById('f-reduced-only').checked = false;
      applyFilters();
    });

    Promise.all([
      fetch('data/units.json').then(r => r.json()).catch(() => []),
      fetch('data/meta.json').then(r => r.json()).catch(() => null),
      fetch('data/events.json').then(r => r.json()).catch(() => []),
    ]).then(([units, meta, events]) => {
      allUnits = units;

      // events.json is newest-first, so the first match per unit is its most recent change.
      const PRICE_CHANGE_WINDOW_DAYS = 14;
      for (const e of events) {
        if (e.type !== 'price_increase' && e.type !== 'price_decrease') continue;
        if (recentChangeByUnit.has(e.unitId)) continue;
        if (daysAgo(e.detectedAt) > PRICE_CHANGE_WINDOW_DAYS) continue;
        recentChangeByUnit.set(e.unitId, e);
      }

      const metaEl = document.getElementById('meta');
      if (meta) {
        const when = new Date(meta.lastRunAt).toLocaleString();
        metaEl.textContent = `Last scrape: ${when} — ${meta.unitCount} units (${meta.newCount} new, ${meta.removedCount} removed, ${meta.priceChangeCount} price changes)`;
      } else {
        metaEl.textContent = 'No scrape data yet — the first scheduled run will populate this.';
      }

      populateFilterOptions(units);
      applyFilters();
    });
  </script>
</body>
</html>
