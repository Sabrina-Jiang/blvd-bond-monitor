<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blvd & Bond Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Blvd &amp; Bond Monitor</h1>
    <nav>
      <a href="index.html">Current Units</a>
      <a href="history.html">Change History</a>
    </nav>
  </header>
  <main>
    <p class="meta" id="meta">Loading…</p>

    <div class="card" id="trend-card" style="display:none">
      <h3>Average price trend</h3>
      <div id="trend-chart"></div>
    </div>

    <div class="card filters">
      <div class="filter-row">
        <label>Bedrooms
          <select id="f-bedrooms"><option value="">All</option></select>
        </label>
        <label>Building
          <select id="f-building"><option value="">All</option></select>
        </label>
        <label>Min price
          <input type="number" id="f-min-price" placeholder="$">
        </label>
        <label>Max price
          <input type="number" id="f-max-price" placeholder="$">
        </label>
        <label>Min sqft
          <input type="number" id="f-min-sqft" placeholder="sqft">
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="f-favorites-only"> Favorites only
        </label>
        <button type="button" id="f-reset" class="btn btn-secondary">Reset</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th></th>
          <th>Unit</th>
          <th>Building</th>
          <th>Type</th>
          <th>Sqft</th>
          <th>Price</th>
          <th>Available</th>
          <th>Days listed</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="units-body"></tbody>
    </table>
  </main>
  <script src="chart.js"></script>
  <script>
    const FAV_KEY = 'bbm_favorites';
    const fmtPrice = (p) => (p != null ? '$' + Number(p).toLocaleString() : '—');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const daysListed = (firstSeenAt) => firstSeenAt ? Math.max(0, Math.floor((Date.now() - new Date(firstSeenAt).getTime()) / 86400000)) : null;

    function loadFavorites() {
      try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY)) || []); } catch { return new Set(); }
    }
    function saveFavorites(set) {
      localStorage.setItem(FAV_KEY, JSON.stringify([...set]));
    }
    let favorites = loadFavorites();

    let allUnits = [];

    function populateFilterOptions(units) {
      const bedrooms = [...new Set(units.map((u) => u.bedrooms).filter(Boolean))].sort();
      const buildings = [...new Set(units.map((u) => u.address).filter(Boolean))].sort();
      const bedroomSel = document.getElementById('f-bedrooms');
      const buildingSel = document.getElementById('f-building');
      bedrooms.forEach((b) => bedroomSel.insertAdjacentHTML('beforeend', `<option value="${esc(b)}">${esc(b)}</option>`));
      buildings.forEach((b) => buildingSel.insertAdjacentHTML('beforeend', `<option value="${esc(b)}">${esc(b)}</option>`));
    }

    function applyFilters() {
      const bedrooms = document.getElementById('f-bedrooms').value;
      const building = document.getElementById('f-building').value;
      const minPrice = parseFloat(document.getElementById('f-min-price').value);
      const maxPrice = parseFloat(document.getElementById('f-max-price').value);
      const minSqft = parseFloat(document.getElementById('f-min-sqft').value);
      const favoritesOnly = document.getElementById('f-favorites-only').checked;

      const filtered = allUnits.filter((u) => {
        if (bedrooms && u.bedrooms !== bedrooms) return false;
        if (building && u.address !== building) return false;
        if (!isNaN(minPrice) && (u.price == null || u.price < minPrice)) return false;
        if (!isNaN(maxPrice) && (u.price == null || u.price > maxPrice)) return false;
        if (!isNaN(minSqft) && (u.sqft == null || u.sqft < minSqft)) return false;
        if (favoritesOnly && !favorites.has(u.unitId)) return false;
        return true;
      });
      renderTable(filtered);
    }

    function toggleFavorite(unitId) {
      if (favorites.has(unitId)) favorites.delete(unitId); else favorites.add(unitId);
      saveFavorites(favorites);
      applyFilters();
    }
    window.toggleFavorite = toggleFavorite;

    function renderTable(units) {
      const body = document.getElementById('units-body');
      const oneDayAgo = Date.now() - 24 * 60 * 60 * 1000;

      if (!units.length) {
        body.innerHTML = '<tr><td colspan="9" class="empty">No units match these filters.</td></tr>';
        return;
      }

      body.innerHTML = units.map((u) => {
        const isNew = u.firstSeenAt && new Date(u.firstSeenAt).getTime() > oneDayAgo;
        const isFav = favorites.has(u.unitId);
        const dl = daysListed(u.firstSeenAt);
        return `<tr class="${isNew ? 'is-new' : ''}">
          <td><button type="button" class="star-btn ${isFav ? 'is-fav' : ''}" onclick="toggleFavorite('${u.unitId}')" aria-label="toggle favorite">${isFav ? '★' : '☆'}</button></td>
          <td><a class="unit-link" href="unit.html?id=${encodeURIComponent(u.unitId)}">${esc(u.unitId)}</a>${isNew ? '<span class="tag tag-new">NEW</span>' : ''}</td>
          <td>${esc(u.address)}</td>
          <td>${esc(u.typeLine)}</td>
          <td>${esc(u.sqft)}</td>
          <td class="price">${fmtPrice(u.price)}</td>
          <td>${esc(u.available)}</td>
          <td>${dl != null ? dl : '—'}</td>
          <td><a href="${esc(u.detailUrl)}" target="_blank" rel="noopener">view</a></td>
        </tr>`;
      }).join('');
    }

    ['f-bedrooms', 'f-building', 'f-min-price', 'f-max-price', 'f-min-sqft', 'f-favorites-only'].forEach((id) => {
      document.getElementById(id).addEventListener('input', applyFilters);
      document.getElementById(id).addEventListener('change', applyFilters);
    });
    document.getElementById('f-reset').addEventListener('click', () => {
      document.getElementById('f-bedrooms').value = '';
      document.getElementById('f-building').value = '';
      document.getElementById('f-min-price').value = '';
      document.getElementById('f-max-price').value = '';
      document.getElementById('f-min-sqft').value = '';
      document.getElementById('f-favorites-only').checked = false;
      applyFilters();
    });

    Promise.all([
      fetch('data/units.json').then(r => r.json()).catch(() => []),
      fetch('data/meta.json').then(r => r.json()).catch(() => null),
      fetch('data/market_history.json').then(r => r.json()).catch(() => []),
    ]).then(([units, meta, marketHistory]) => {
      allUnits = units;
      const metaEl = document.getElementById('meta');
      if (meta) {
        const when = new Date(meta.lastRunAt).toLocaleString();
        metaEl.textContent = `Last scrape: ${when} — ${meta.unitCount} units (${meta.newCount} new, ${meta.removedCount} removed, ${meta.priceChangeCount} price changes)`;
      } else {
        metaEl.textContent = 'No scrape data yet — the first scheduled run will populate this.';
      }

      populateFilterOptions(units);
      renderTable(units);

      if (marketHistory && marketHistory.length >= 2) {
        document.getElementById('trend-card').style.display = '';
        const points = marketHistory.filter((m) => m.avgPrice != null).map((m) => ({ x: new Date(m.at), y: m.avgPrice }));
        renderLineChart(document.getElementById('trend-chart'), points);
      }
    });
  </script>
</body>
</html>
