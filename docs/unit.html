<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit — Blvd & Bond Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Blvd &amp; Bond Monitor</h1>
    <nav>
      <a href="index.html">Current Units</a>
      <a href="history.html">Change History</a>
    </nav>
  </header>
  <main id="main">Loading…</main>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmtPrice = (p) => (p != null ? '$' + Number(p).toLocaleString() : '—');

    const id = new URLSearchParams(location.search).get('id') || '';

    fetch('data/units.json').then(r => r.json()).catch(() => []).then((units) => {
      const unit = units.find((u) => u.unitId === id);
      const main = document.getElementById('main');

      const historyRows = (unit && unit.priceHistory ? unit.priceHistory : [])
        .slice().reverse()
        .map((h) => `<tr><td>${new Date(h.at).toLocaleString()}</td><td>${fmtPrice(h.price)}</td></tr>`)
        .join('') || '<tr><td colspan="2" class="empty">No price history yet.</td></tr>';

      if (!unit) {
        main.innerHTML = `<div class="card"><p>Unit <strong>${esc(id)}</strong> is not currently listed (it may have been removed or leased).</p></div>
          <div class="card"><h3>Price history</h3><table><thead><tr><th>Date</th><th>Price</th></tr></thead><tbody>${historyRows}</tbody></table></div>`;
        return;
      }

      main.innerHTML = `
        <div class="card">
          <h2>${esc(unit.unitId)} — ${esc(unit.address)}</h2>
          <p>${esc(unit.typeLine)} · ${esc(unit.sqft)} sqft</p>
          <p class="price">${fmtPrice(unit.price)} /mo — ${esc(unit.available)}</p>
          <p><a href="${esc(unit.detailUrl)}" target="_blank" rel="noopener">View on blvdbond.com</a></p>
        </div>
        <div class="card">
          <h3>Price history</h3>
          <table><thead><tr><th>Date</th><th>Price</th></tr></thead><tbody>${historyRows}</tbody></table>
        </div>`;
    });
  </script>
</body>
</html>
